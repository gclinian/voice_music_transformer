name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - name: Install FluidSynth (needed for pyfluidsynth to import)
        run: |
          sudo apt-get update
          sudo apt-get install -y fluidsynth libportaudio2

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Sync dependencies (incl. dev group)
        run: uv sync --group dev --python ${{ matrix.python-version }}

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .
        continue-on-error: true  # format is advisory until we commit to it

      - name: Tests (headless — no audio devices required)
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run pytest -q

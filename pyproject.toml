[project]
name = "voice-to-piano"
version = "0.2.0"
description = "Sing into a mic, hear piano (or violin, cello, …) with auto-generated chords. Exports WAV, MIDI, and MusicXML."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "audio",
    "music",
    "midi",
    "pitch-detection",
    "fluidsynth",
    "soundfont",
    "harmonization",
    "musicxml",
    "pyside6",
    "voice-to-piano",
]
authors = [
    { name = "GCman" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: MacOS X",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Multimedia :: Sound/Audio :: MIDI",
    "Topic :: Multimedia :: Sound/Audio :: Sound Synthesis",
    "Topic :: Artistic Software",
]
dependencies = [
    "mido>=1.3.3",
    "music21>=10.1.0",
    "numpy>=2.4.6",
    "pyfluidsynth>=1.3.4",
    "pyside6-essentials>=6.11.1",
    "scipy>=1.17.1",
    "sounddevice>=0.5.5",
]

[project.urls]
Homepage = "https://github.com/gclinian/voice_music_transformer"
Repository = "https://github.com/gclinian/voice_music_transformer"
Issues = "https://github.com/gclinian/voice_music_transformer/issues"
Changelog = "https://github.com/gclinian/voice_music_transformer/blob/main/CHANGELOG.md"

[project.scripts]
voice-to-piano = "main:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = [
    "E501",   # line too long — handled by formatter
    "B008",   # function call in default arg (Qt patterns)
    "SIM105", # try/except/pass — overhead of contextlib.suppress is real on audio hot paths
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

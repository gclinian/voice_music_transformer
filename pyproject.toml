[project]
name = "voice-to-piano"
version = "0.1.0"
description = "Real-time voice-to-piano: sing into the mic, hear piano notes."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mido>=1.3.3",
    "numpy>=2.4.6",
    "pyfluidsynth>=1.3.4",
    "pyside6-essentials>=6.11.1",
    "scipy>=1.17.1",
    "sounddevice>=0.5.5",
]
